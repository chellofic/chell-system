<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новости школы №87</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f4f6fb;
    color: #1b1f2a;
    line-height: 1.5;
    padding-bottom: 80px;
  }
  header {
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .logo {
    width: 40px; height: 40px; border-radius: 10px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; flex-shrink: 0;
  }
  .school-name h1 { margin: 0; font-size: 16px; }
  .school-name p { margin: 0; font-size: 11px; color: #6b7280; }
  .badge {
    margin-left: auto; font-size: 11px; font-weight: 700;
    color: #dc2626; background: #fee2e2;
    padding: 3px 8px; border-radius: 999px; display: none;
  }
  .badge.show { display: inline-block; }

  .hero {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff; margin: 12px; border-radius: 14px; padding: 20px;
  }
  .hero h2 { margin: 0 0 6px; font-size: 20px; }
  .hero p { margin: 0; font-size: 13px; opacity: 0.92; }
  .demo-tag {
    display: inline-block; background: rgba(255,255,255,0.2);
    padding: 3px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; margin-bottom: 10px;
  }

  main { padding: 0 12px; }

  .toolbar { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .search-wrap { position: relative; }
  .search-wrap input {
    width: 100%; padding: 11px 14px 11px 38px;
    border: 1px solid #e5e7eb; border-radius: 10px;
    font-size: 14px; outline: none; background: #fff;
    color: #1b1f2a; font-family: inherit;
  }
  .search-wrap input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }
  .search-wrap::before {
    content: "🔍"; position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%); font-size: 14px;
    opacity: 0.5; pointer-events: none;
  }
  .filter-select {
    padding: 11px 14px; border: 1px solid #e5e7eb;
    border-radius: 10px; font-size: 14px;
    background: #fff; color: #1b1f2a;
    font-family: inherit; outline: none; cursor: pointer;
  }

  .section-title {
    display: flex; align-items: center; gap: 10px;
    margin: 0 0 12px; font-size: 18px;
  }
  .section-title .count {
    font-size: 12px; color: #6b7280; font-weight: 400;
  }

  .news-grid { display: flex; flex-direction: column; gap: 12px; }
  .news-card {
    background: #fff; border: 1px solid #e5e7eb;
    border-radius: 14px; overflow: hidden;
  }
  .news-image {
    width: 100%; height: 160px; object-fit: cover;
    background: #e5e7eb; display: block;
  }
  .news-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .news-date { font-size: 12px; color: #6b7280; font-weight: 600; }
  .news-title { margin: 0; font-size: 16px; font-weight: 700; }
  .news-text { margin: 0; font-size: 14px; color: #374151; white-space: pre-wrap; }
  .news-tag {
    display: inline-block; font-size: 11px; font-weight: 700;
    background: #eef2ff; color: #2563eb;
    padding: 3px 8px; border-radius: 999px; align-self: flex-start;
  }
  .empty {
    text-align: center; color: #6b7280; padding: 30px;
    background: #fff; border: 1px dashed #e5e7eb;
    border-radius: 14px;
  }

  /* Админка — теперь ВСЕГДА видимая кнопка в углу */
  #adminBtn {
    position: fixed; bottom: 16px; right: 16px;
    width: 56px; height: 56px; border-radius: 50%;
    background: #dc2626; color: #fff;
    border: none; cursor: pointer;
    font-size: 24px; font-weight: 700;
    box-shadow: 0 6px 20px rgba(220,38,38,0.4);
    z-index: 300;
  }
  #adminBtn:active { transform: scale(0.95); }

  .admin {
    display: none; background: #fff;
    border: 2px solid #dc2626; border-radius: 14px;
    padding: 16px; margin: 12px; position: relative;
  }
  .admin.open { display: block; }
  .admin h3 { margin: 0 0 14px; font-size: 17px; color: #dc2626; }
  .admin-close {
    position: absolute; top: 10px; right: 10px;
    background: #f3f4f6; border: none; width: 32px; height: 32px;
    border-radius: 8px; cursor: pointer; font-size: 16px;
  }
  .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .form-row label { font-size: 13px; font-weight: 600; color: #374151; }
  .form-row input, .form-row textarea, .form-row select {
    padding: 10px 12px; border: 1px solid #e5e7eb;
    border-radius: 8px; font-size: 14px; font-family: inherit;
    outline: none; background: #fff; color: #1b1f2a; width: 100%;
  }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }
  .form-row textarea { resize: vertical; min-height: 70px; }
  .image-preview {
    margin-top: 8px; border: 1px dashed #e5e7eb;
    border-radius: 10px; padding: 10px; text-align: center;
    min-height: 50px; display: flex; align-items: center;
    justify-content: center; color: #6b7280; font-size: 13px;
  }
  .image-preview img { max-width: 100%; max-height: 180px; border-radius: 8px; }
  .admin-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    border: none; border-radius: 8px; padding: 10px 14px;
    font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn-primary { background: #2563eb; color: #fff; }
  .btn-ghost { background: #f3f4f6; color: #1b1f2a; }
  .btn-danger { background: #fee2e2; color: #dc2626; }

  .admin-list { margin-top: 16px; border-top: 1px solid #e5e7eb; padding-top: 12px; }
  .admin-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0; border-bottom: 1px solid #f3f4f6; font-size: 13px;
  }
  .admin-item:last-child { border-bottom: none; }
  .admin-item .info { flex: 1; min-width: 0; }
  .admin-item .info strong {
    display: block; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .admin-item .info span { font-size: 11px; color: #6b7280; }

  /* Лог в углу */
  #logBox {
    position: fixed; bottom: 80px; left: 8px;
    max-width: 60vw; background: rgba(17,24,39,0.92);
    color: #0f0; font-family: monospace; font-size: 10px;
    padding: 6px 8px; border-radius: 8px;
    z-index: 250; max-height: 120px; overflow: auto;
    white-space: pre-wrap; display: none;
  }
  #logBox.show { display: block; }

  footer {
    text-align: center; padding: 20px;
    color: #6b7280; font-size: 12px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">87</div>
  <div class="school-name">
    <h1>Школа №87</h1>
    <p>Демо-новости · вымышленные</p>
  </div>
  <span class="badge" id="adminBadge">админ</span>
</header>

<section class="hero">
  <div class="demo-tag">ДЕМО</div>
  <h2>Новости школы №87</h2>
  <p>Кот стал замдиректора, в столовой ввели «Компот», на перемене нашли портал.</p>
</section>

<main>
  <div class="toolbar">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Поиск по новостям...">
    </div>
    <select class="filter-select" id="filterTag">
      <option value="">Все рубрики</option>
    </select>
  </div>

  <section>
    <h2 class="section-title">
      Новости
      <span class="count" id="newsCount"></span>
    </h2>
    <div class="news-grid" id="newsGrid"></div>
  </section>
</main>

<!-- АДМИНКА -->
<section class="admin" id="adminPanel">
  <button class="admin-close" id="adminClose">✕</button>
  <h3>Панель администратора</h3>

  <div class="form-row">
    <label for="newsTitle">Заголовок</label>
    <input type="text" id="newsTitle" placeholder="Заголовок новости">
  </div>

  <div class="form-row">
    <label for="newsText">Текст</label>
    <textarea id="newsText" placeholder="Текст новости..."></textarea>
  </div>

  <div class="form-row">
    <label for="newsTag">Рубрика</label>
    <select id="newsTag">
      <option>Школьная жизнь</option>
      <option>Происшествия</option>
      <option>Столовая</option>
      <option>Олимпиады</option>
      <option>Кружки</option>
      <option>Мистика</option>
    </select>
  </div>

  <div class="form-row">
    <label>Картинка (ссылка)</label>
    <input type="text" id="newsImageUrl" placeholder="https://...jpg">
    <input type="file" id="newsImageFile" accept="image/*" style="margin-top:6px;">
    <div class="image-preview" id="imagePreview">Картинка не выбрана</div>
  </div>

  <div class="admin-actions">
    <button class="btn btn-primary" id="addNewsBtn">Добавить</button>
    <button class="btn btn-ghost" id="clearImageBtn">Убрать картинку</button>
    <button class="btn btn-ghost" id="resetBtn">Сбросить к демо</button>
  </div>

  <div class="admin-list" id="adminList"></div>
</section>

<footer>© 2025 Школа №87 · Демо · Все события вымышлены</footer>

<!-- КНОПКА АДМИНКИ — всегда видна -->
<button id="adminBtn" title="Админка">⚙</button>

<!-- ЛОГ -->
<div id="logBox"></div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'school87_v4';
  var storageOK = true;

  // ---------- ЛОГ ----------
  var logBox = document.getElementById('logBox');
  var logLines = [];
  function log(msg) {
    logLines.push(msg);
    if (logLines.length > 8) logLines.shift();
    logBox.textContent = logLines.join('\n');
  }
  // Показываем лог при долгом тапе по логотипу
  var logoTap = 0, logoTimer = null;
  document.querySelector('.logo').addEventListener('click', function () {
    logoTap++;
    clearTimeout(logoTimer);
    if (logoTap >= 3) {
      logoTap = 0;
      logBox.classList.toggle('show');
    } else {
      logoTimer = setTimeout(function () { logoTap = 0; }, 600);
    }
  });

  // ---------- ПРОВЕРКА localStorage ----------
  try {
    localStorage.setItem('__t', '1');
    localStorage.removeItem('__t');
    log('localStorage OK');
  } catch (e) {
    storageOK = false;
    log('localStorage НЕДОСТУПЕН: ' + e.message);
  }

  // ---------- ДАННЫЕ ----------
  var DEMO = [
    { id: 1, title: 'Школьный кот стал заместителем директора по уюту', text: 'Кот Барсик избран единогласно. Первый указ — перерыв на поглаживание.', tag: 'Школьная жизнь', date: '2025-09-22', image: '' },
    { id: 2, title: 'В столовой ввели предмет «Компот»', text: 'Уроки по вторникам. Домашка: выпить стакан и не поморщиться.', tag: 'Столовая', date: '2025-09-20', image: '' },
    { id: 3, title: 'Ученик победил в олимпиаде по сну, но проспал награждение', text: 'Жюри отметило глубокий подход. Награду вручат позже.', tag: 'Олимпиады', date: '2025-09-18', image: '' },
    { id: 4, title: 'На перемене нашли портал в кабинет математики', text: 'Учёные школы продолжают исследования. Ученики просят спортзал.', tag: 'Мистика', date: '2025-09-15', image: '' },
    { id: 5, title: 'Открыта запись в кружок робототехники', text: 'Роботы иногда пытаются уйти домой. Запись у классных.', tag: 'Кружки', date: '2025-09-12', image: '' },
    { id: 6, title: 'Туалетная бумага объявила забастовку', text: 'Требования: уважение, отдельная полка, отсутствие экспериментов.', tag: 'Происшествия', date: '2025-09-10', image: '' }
  ];

  var news = [];
  var pendingImage = '';

  // ---------- DOM ----------
  var $ = function (id) { return document.getElementById(id); };
  var newsGrid = $('newsGrid');
  var newsCount = $('newsCount');
  var adminPanel = $('adminPanel');
  var adminList = $('adminList');
  var adminBadge = $('adminBadge');
  var searchInput = $('searchInput');
  var filterTag = $('filterTag');
  var imagePreview = $('imagePreview');
  var newsImageUrl = $('newsImageUrl');
  var newsImageFile = $('newsImageFile');

  // ---------- HELPERS ----------
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d)) return iso;
    var months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
  }

  function showToast(msg) {
    log('toast: ' + msg);
  }

  // ---------- STORAGE ----------
  function load() {
    news = [];
    if (!storageOK) {
      news = DEMO.map(function (n) { return Object.assign({}, n); });
      log('использую DEMO (нет storage)');
      return;
    }
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed) && parsed.length) {
          news = parsed;
          log('загружено ' + news.length + ' новостей');
          return;
        }
      }
    } catch (e) {
      log('ошибка чтения: ' + e.message);
    }
    news = DEMO.map(function (n) { return Object.assign({}, n); });
    save();
    log('загружено DEMO');
  }

  function save() {
    if (!storageOK) return false;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(news));
      log('сохранено ' + news.length + ' шт');
      return true;
    } catch (e) {
      log('ОШИБКА сохранения: ' + e.message);
      return false;
    }
  }

  // ---------- RENDER ----------
  function visibleNews() {
    var q = (searchInput.value || '').trim().toLowerCase();
    var tag = filterTag.value;
    return news.filter(function (item) {
      if (tag && item.tag !== tag) return false;
      if (!q) return true;
      var hay = (item.title + ' ' + item.text + ' ' + (item.tag || '')).toLowerCase();
      return hay.indexOf(q) !== -1;
    }).sort(function (a, b) {
      return String(b.date || '').localeCompare(String(a.date || ''));
    });
  }

  function render() {
    var vis = visibleNews();
    newsCount.textContent = '· ' + vis.length + ' из ' + news.length;

    if (!vis.length) {
      newsGrid.innerHTML = '<div class="empty">Ничего не найдено.</div>';
      return;
    }

    var html = '';
    for (var i = 0; i < vis.length; i++) {
      var item = vis[i];
      var img = item.image
        ? '<img class="news-image" src="' + esc(item.image) + '" alt="" onerror="this.style.display=\'none\'">'
        : '';
      html += '<article class="news-card">' + img +
        '<div class="news-body">' +
          '<span class="news-tag">' + esc(item.tag || 'Новость') + '</span>' +
          '<div class="news-date">' + esc(fmtDate(item.date)) + '</div>' +
          '<h3 class="news-title">' + esc(item.title) + '</h3>' +
          '<p class="news-text">' + esc(item.text) + '</p>' +
        '</div></article>';
    }
    newsGrid.innerHTML = html;
  }

  function renderAdmin() {
    adminList.innerHTML = '';
    if (!news.length) {
      adminList.innerHTML = '<div class="empty">Пусто.</div>';
      return;
    }
    for (var i = 0; i < news.length; i++) {
      (function (item) {
        var row = document.createElement('div');
        row.className = 'admin-item';
        row.innerHTML =
          '<div class="info">' +
            '<strong>' + esc(item.title) + '</strong>' +
            '<span>' + esc(item.tag || '') + ' · ' + esc(fmtDate(item.date)) + '</span>' +
          '</div>' +
          '<button class="btn btn-danger">Удалить</button>';
        row.querySelector('button').addEventListener('click', function () {
          news = news.filter(function (n) { return n.id !== item.id; });
          save(); render(); renderAdmin(); renderTags();
          log('удалено: ' + item.title);
        });
        adminList.appendChild(row);
      })(news[i]);
    }
  }

  function renderTags() {
    var cur = filterTag.value;
    var tags = [];
    for (var i = 0; i < news.length; i++) {
      if (news[i].tag && tags.indexOf(news[i].tag) === -1) tags.push(news[i].tag);
    }
    tags.sort();
    var html = '<option value="">Все рубрики</option>';
    for (var j = 0; j < tags.length; j++) {
      html += '<option value="' + esc(tags[j]) + '">' + esc(tags[j]) + '</option>';
    }
    filterTag.innerHTML = html;
    if (tags.indexOf(cur) !== -1) filterTag.value = cur;
  }

  function updatePreview() {
    if (pendingImage) {
      imagePreview.innerHTML = '<img src="' + esc(pendingImage) + '" alt="">';
    } else {
      imagePreview.textContent = 'Картинка не выбрана';
    }
  }

  // ---------- ACTIONS ----------
  function addNews() {
    var title = $('newsTitle').value.trim();
    var text = $('newsText').value.trim();
    var tag = $('newsTag').value;

    if (!title) { alert('Введите заголовок'); return; }
    if (!text) { alert('Введите текст'); return; }

    news.unshift({
      id: Date.now(),
      title: title,
      text: text,
      tag: tag,
      date: new Date().toISOString().slice(0, 10),
      image: pendingImage || ''
    });

    save();
    render(); renderAdmin(); renderTags();

    $('newsTitle').value = '';
    $('newsText').value = '';
    pendingImage = '';
    newsImageUrl.value = '';
    newsImageFile.value = '';
    updatePreview();

    log('добавлено: ' + title);
    alert('Новость добавлена');
  }

  function resetNews() {
    if (!confirm('Сбросить всё к демо?')) return;
    news = DEMO.map(function (n) { return Object.assign({}, n); });
    save(); render(); renderAdmin(); renderTags();
    log('сброшено к демо');
  }

  function toggleAdmin(force) {
    var open = (typeof force === 'boolean') ? force : !adminPanel.classList.contains('open');
    adminPanel.classList.toggle('open', open);
    adminBadge.classList.toggle('show', open);
    if (open) {
      renderAdmin();
      try { adminPanel.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) {}
      log('админка открыта');
    } else {
      log('админка закрыта');
    }
  }

  // ---------- СОБЫТИЯ ----------
  $('adminBtn').addEventListener('click', function () {
    // ЕДИНСТВЕННОЕ ДОБАВЛЕНИЕ: запрос пароля перед открытием админки
    var pass = prompt('Введите пароль для входа в админку:');
    if (pass === null) return;           // отмена
    if (pass === '28977744') {
      toggleAdmin();
    } else {
      alert('Неверный пароль');
      log('неверный пароль');
    }
  });

  $('adminClose').addEventListener('click', function () { toggleAdmin(false); });
  $('addNewsBtn').addEventListener('click', addNews);
  $('resetBtn').addEventListener('click', resetNews);
  $('clearImageBtn').addEventListener('click', function () {
    pendingImage = '';
    newsImageUrl.value = '';
    newsImageFile.value = '';
    updatePreview();
  });

  newsImageUrl.addEventListener('input', function () {
    pendingImage = newsImageUrl.value.trim();
    updatePreview();
  });

  newsImageFile.addEventListener('change', function () {
    var file = newsImageFile.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      pendingImage = e.target.result;
      newsImageUrl.value = '';
      updatePreview();
      log('картинка загружена');
    };
    reader.readAsDataURL(file);
  });

  searchInput.addEventListener('input', render);
  filterTag.addEventListener('change', render);

  // ---------- СТАРТ ----------
  log('старт...');
  load();
  render();
  renderAdmin();
  renderTags();
  updatePreview();
  log('готово. Новостей: ' + news.length);

})();
</script>

</body>
</html>
